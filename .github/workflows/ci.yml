name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同分支取消旧 CI，避免资源浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI 不跑视频渲染（太慢）；Remotion 浏览器下载也跳过
env:
  REMOTION_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # 硬性超时：lint + typecheck + test + build 须在 15 分钟内跑完
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.17
          # 仅缓存 pnpm store，不缓存 node_modules
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
